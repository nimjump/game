; urls.ini — the CLIENT's URLs (the Godot game + its exported web files).
;
; Change your domains here, then run:
;     python setup/apply_urls.py     (before the Godot export)
;     python setup/build.py          (after it, as usual)
;
; The backend and the admin panel read their own URLs from their own .env
; files — this file has nothing to do with them.

[urls]

; Where the Go backend is reachable. No trailing slash.
;   e.g.  https://api.example.com   /   http://1.2.3.4:8080
api_base = https://backbone.zetashare.com

; The public URL players open — share/replay/VS invite links and every
; SEO/social tag. No trailing slash.
game_url = https://nimjump.zetashare.com
